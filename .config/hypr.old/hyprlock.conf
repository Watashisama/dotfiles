background {
  monitor =
  path = ~/.config/hypr/wallpapers/tokyonight_original.png
  color = $colBlue
  blur_passes = 2
}

input-field {
  monitor =
  size = 20%, 5%
  outline_thickness = 3
  inner_color = rgba(0, 0, 0, 0.0) # no fill

  outer_color = $colCyan $colGreen 45deg
  check_color = $colGreen $colDeepOrange 120deg
  fail_color = $colOrange $colRed 40deg

  font_color = rgb(143, 143, 143)
  fade_on_empty = false
  rounding = 15

  position = 0, -20
  halign = center
  valign = center
}

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Always prefer Jigmo for Japanese -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>

    <edit name="family" mode="prepend" binding="strong">
      <string>Jigmo</string>
    </edit>
  </match>

  <!-- Push Noto Sans to the end for Japanese -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>


    <edit name="family" mode="append">
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Push Noto Serif to the end for Japanese -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>


    <edit name="family" mode="append">
      <string>Noto Serif</string>
    </edit>
  </match>

</fontconfig>

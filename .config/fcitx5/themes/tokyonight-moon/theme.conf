# vim: ft=dosini
[Metadata]
Name=Tokyo Night Moon
Version=1.0
Author=Tokyo Night Port
Description=Tokyo Night Moon Color Theme
ScaleWithDPI=True

[InputPanel]
Font=Sans 13
Spacing=3

# Unselected candidate color
# Foreground
NormalColor=#c8d3f5
# Selected candidate color
# Surface
HighlightCandidateColor=#2f334d
# Input character color
# Red
HighlightColor=#ff757f
# Input character background color
# Muted surface
HighlightBackgroundColor=#3b4261

[InputPanel/TextMargin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/Background]
# Main background
Color=#222436

# Uncomment this to switch to rounded-corner
# Image=panel.svg

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
# Accent red
Color=#ff757f

# Uncomment this to switch to rounded-corner
# Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[Menu]
Font=Sans 10
# Foreground
NormalColor=#c8d3f5
Spacing=3

[Menu/Background]
# Surface
Color=#2f334d

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
# Accent purple
Color=#c099ff

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
# Muted border
Color=#3b4261

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
